# devctl default settings.
#
# Every setting devctl understands is listed here with its default value.
# Override in ~/.config/devctl/devctl.conf (same syntax, file mode 600), or for one run with
# an environment variable DEVCTL_CFG_<KEY>: key upper-cased, dots become underscores
# (e.g. DEVCTL_CFG_DOMAIN_SUFFIX=test).
#
# Syntax: "key = value". Values are literal text: no variables, no command substitution.
# A "# @type TYPE" line declares how the next key is validated. Settings are added here
# as the modules that use them are built.

## Output

# Colors: auto (only on a terminal and when NO_COLOR is unset), always or never.
# @type enum:auto,always,never
ui.color = auto

# Diagnostics shown on the terminal. The log file always records info and above.
# @type enum:debug,info,warn,error
log.level = warn

# Days of devctl log files to keep.
# @type uint
log.retention_days = 7

## System

# Static hostname devctl expects (devctl doctor offers to set it). Phones reach it as <name>.local.
# @type hostname
system.hostname = zaitoune-laptop

## Projects

# @type path
projects.root = ~/Desktop/projects

# Category folders under projects.root (work, personal, school).
# @type words
projects.categories = elden personal school

## Domains

# Local domain suffix: a project "shop" is served at shop.<suffix>.
# @type domain_suffix
domain.suffix = test

# Names that cannot be used for projects.
# @type words
domain.reserved = devctl mail localhost www

## Guards

# Warn before starting heavy services when available RAM is below this percentage.
# @type percent
guard.memory_min_available_percent = 25

# Warn when free disk space is at or below this percentage.
# @type percent
guard.disk_min_free_percent = 20

## Dashboard

# Port on 127.0.0.1 (only reachable from this laptop).
# @type port
dashboard.port = 7780

# Fedora's system Python (the dashboard uses only the standard library).
# @type abs_path
dashboard.python = /usr/bin/python3

## Container engine

# Which engine adapter to use (lib/adapters/engine/<name>.sh).
# @type enum:docker
engine.adapter = docker

# Prefix of container and compose project names (devctl-mysql-8-4, …).
# @type identifier
engine.name_prefix = devctl

## Runtimes

# Default versions for new projects (projects pin their own with .nvmrc, .java-version, …).
# @type version
runtime.node_default = 26
# @type version
runtime.java_default = 25
# @type version
runtime.python_default = 3.14

## Web server

# Which web server adapter to use (lib/adapters/web/<name>.sh).
# @type enum:caddy
web.adapter = caddy

## Local names

# Which local-names adapter to use (lib/adapters/dns/<name>.sh).
# @type enum:hosts
dns.adapter = hosts

## Install (devctl self install)

# Also put the "devctl Dashboard" launcher on the desktop (needs a desktop-icons extension).
# @type bool
self.desktop_icon = true

## Internals

# Seconds to wait for another devctl run to release a lock.
# @type uint
lock.timeout_seconds = 30
