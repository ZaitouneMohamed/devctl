# RustFS: S3-compatible object storage (MinIO replacement, ADR-0017). Console on its own port.
category = service
name = RustFS (S3 storage)
kind = server
image = rustfs/rustfs:{major}
majors = 1.0.4
default_major = 1.0.4
container_port = 9000
default_host_port = 9000
extra_ports = console:9001
heavy = no
root_secret = RUSTFS_ACCESS_KEY RUSTFS_SECRET_KEY
hint = AWS_ENDPOINT=http://127.0.0.1:{{PORT}} AWS_USE_PATH_STYLE_ENDPOINT=true AWS_ACCESS_KEY_ID=<RUSTFS_ACCESS_KEY> AWS_SECRET_ACCESS_KEY=<RUSTFS_SECRET_KEY> · console http://127.0.0.1:{{PORT_CONSOLE}}
