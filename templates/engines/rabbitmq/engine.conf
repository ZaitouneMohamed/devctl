# RabbitMQ with the management UI.
category = service
name = RabbitMQ
kind = server
image = rabbitmq:{major}-management-alpine
majors = 4.4
default_major = 4.4
container_port = 5672
default_host_port = 5672
extra_ports = ui:15672
heavy = no
root_secret = RABBITMQ_DEFAULT_PASS
static_env = RABBITMQ_DEFAULT_USER=devctl
hint = RABBITMQ_HOST=127.0.0.1 RABBITMQ_PORT={{PORT}} RABBITMQ_USER=devctl RABBITMQ_PASSWORD=<RABBITMQ_DEFAULT_PASS> · UI http://127.0.0.1:{{PORT_UI}}
