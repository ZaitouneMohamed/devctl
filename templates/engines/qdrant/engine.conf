# Qdrant vector database. No per-project users: projects share the server's API key and
# keep their collections apart by name. Web dashboard: http://127.0.0.1:<port>/dashboard
name = Qdrant
kind = server
image = qdrant/qdrant:v{major}
majors = 1.20
default_major = 1.20
container_port = 6333
default_host_port = 6333
heavy = yes
root_secret = QDRANT__SERVICE__API_KEY
per_project_users = no
