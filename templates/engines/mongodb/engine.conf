# MongoDB (TablePlus support for MongoDB is in beta).
name = MongoDB
kind = server
image = mongo:{major}
majors = 8.0
default_major = 8.0
container_port = 27017
default_host_port = 27017
heavy = yes
root_secret = MONGO_INITDB_ROOT_PASSWORD
root_user = MONGO_INITDB_ROOT_USERNAME=root
per_project_users = yes
