# Mailpit: catches every email your apps send (nothing leaves the laptop). Web UI at
# https://mail.<suffix>; SMTP on 127.0.0.1. Mails are kept in memory only.
category = service
name = Mailpit (mail catcher)
kind = server
image = axllent/mailpit:v{major}
majors = 1.33
default_major = 1.33
container_port = 1025
default_host_port = 1025
extra_ports = ui:8025
heavy = no
persistent = no
web_name = mail
hint = MAIL_MAILER=smtp MAIL_HOST=127.0.0.1 MAIL_PORT={{PORT}} · web UI https://mail.{{SUFFIX}}
