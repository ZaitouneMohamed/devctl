# PostgreSQL with the pgvector extension (image pgvector/pgvector, based on the official image).
name = PostgreSQL + pgvector
kind = server
image = pgvector/pgvector:pg{major}
majors = 18
default_major = 18
container_port = 5432
default_host_port = 5432
heavy = yes
root_secret = POSTGRES_PASSWORD
per_project_users = yes
