# Elasticsearch, single node, security off (reachable only on 127.0.0.1), 1 GiB heap.
category = service
name = Elasticsearch
kind = server
image = elasticsearch:{major}
majors = 9.5.5
default_major = 9.5.5
container_port = 9200
default_host_port = 9200
heavy = yes

hint = ELASTICSEARCH_HOST=http://127.0.0.1:{{PORT}} (no password; loopback only)
