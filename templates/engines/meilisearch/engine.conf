# Meilisearch: search engine (Laravel Scout). Master key generated by devctl.
category = service
name = Meilisearch
kind = server
image = getmeili/meilisearch:v{major}
majors = 1.56
default_major = 1.56
container_port = 7700
default_host_port = 7700
heavy = no
root_secret = MEILI_MASTER_KEY
static_env = MEILI_ENV=development MEILI_NO_ANALYTICS=true
hint = SCOUT_DRIVER=meilisearch MEILISEARCH_HOST=http://127.0.0.1:{{PORT}} MEILISEARCH_KEY=<MEILI_MASTER_KEY>
